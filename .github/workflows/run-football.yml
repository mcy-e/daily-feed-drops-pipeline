name: Run Football Pipeline

on:
  schedule:
    - cron: '0 12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Reconstruct Google OAuth Tokens
        env:
          CLIENT_SECRET_B64: ${{ secrets.GOOGLE_CLIENT_SECRET_B64 }}
          TOKEN_B64: ${{ secrets.GOOGLE_OAUTH_TOKEN_B64 }}
        run: |
          mkdir -p config
          echo "$CLIENT_SECRET_B64" | base64 --decode > config/client_secret_fc.json
          echo "$TOKEN_B64" | base64 --decode > config/token_fc.json

      - name: Run Pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_PRIVACY_STATUS: ${{ env.YOUTUBE_PRIVACY_STATUS || 'private' }}
        run: |
          python -m scripts.run_pipeline

      - name: Commit and Push DB Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/used_clips.db
          git diff --staged --quiet || git commit -m "[BOT] Update used clips tracking database"
          git push
