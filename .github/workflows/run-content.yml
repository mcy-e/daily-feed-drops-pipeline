name: Run Content Pipeline

on:
  schedule:
    # meme_recap — 5 times daily
    - cron: '0 7 * * *'
    - cron: '32 11 * * *'
    - cron: '40 14 * * *'
    - cron: '30 19 * * *'
    - cron: '50 23 * * *'
    # cursed_screenshots — Monday and Thursday at 19:00 UTC
    - cron: '0 19 * * 1'
    - cron: '0 19 * * 4'
  workflow_dispatch:
    inputs:
      content_type:
        description: 'Content type to generate'
        required: true
        type: choice
        options:
          - meme_recap
          - cursed_screenshots
      force:
        description: 'Force run (bypass schedule check)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run-content:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Reconstruct Google OAuth tokens
        env:
          CLIENT_SECRET_B64: ${{ secrets.GOOGLE_CLIENT_SECRET_B64 }}
          TOKEN_B64: ${{ secrets.GOOGLE_OAUTH_TOKEN_B64 }}
        run: |
          mkdir -p config
          echo "$CLIENT_SECRET_B64" | base64 --decode > config/client_secret_v2.json
          echo "$TOKEN_B64" | base64 --decode > config/token_v2.json

      - name: Run content pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_BROLL_FOLDER_ID: ${{ secrets.GDRIVE_BROLL_FOLDER_ID }}
          GDRIVE_MEMES_FOLDER_ID: ${{ secrets.GDRIVE_MEMES_FOLDER_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m scripts.run_content_pipeline \
              --type "${{ inputs.content_type }}" \
              ${{ (inputs.force == true || inputs.force == 'true') && '--force' || '' }}
          else
            # Scheduled run: pick type based on day of week
            # Day 1 = Monday, Day 4 = Thursday → cursed_screenshots
            DOW=$(date +%u)
            HOUR=$(date +%H)
            if [ "$DOW" = "1" ] || [ "$DOW" = "4" ]; then
              if [ "$HOUR" = "19" ]; then
                python -m scripts.run_content_pipeline --type "cursed_screenshots" --force
              else
                python -m scripts.run_content_pipeline --type "meme_recap" --force
              fi
            else
              python -m scripts.run_content_pipeline --type "meme_recap" --force
            fi
          fi