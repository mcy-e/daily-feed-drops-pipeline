name: Run Content Pipeline

on:
  schedule:
    - cron: '13 6 * * *'   # dark_facts
    - cron: '19 13 * * *'  # meme_recap
    - cron: '21 20 * * *'  # shower_thoughts
  workflow_dispatch:
    inputs:
      content_type:
        description: 'Content type to generate'
        required: true
        type: choice
        options:
          - meme_recap
          - dark_facts
          - shower_thoughts
      force:
        description: 'Force run (bypass schedule check)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run-content:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install yt-dlp

      - name: Reconstruct Google OAuth tokens
        env:
          CLIENT_SECRET_B64: ${{ secrets.GOOGLE_CLIENT_SECRET_B64 }}
          TOKEN_B64: ${{ secrets.GOOGLE_OAUTH_TOKEN_B64 }}
        run: |
          mkdir -p config
          echo "$CLIENT_SECRET_B64" | base64 --decode > config/client_secret_v2.json
          echo "$TOKEN_B64" | base64 --decode > config/token_v2.json

      - name: Run content pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m scripts.run_content_pipeline \
              --type "${{ inputs.content_type }}" \
              ${{ (inputs.force == true || inputs.force == 'true') && '--force' || '' }}
          else
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            echo "UTC time: $HOUR:$MINUTE"
            for type in meme_recap dark_facts shower_thoughts; do
              python -m scripts.run_content_pipeline --type "$type" || echo "[$type] failed, continuing"
            done
          fi